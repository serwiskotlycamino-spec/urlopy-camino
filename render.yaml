databases:
  - name: urlopy-db
    plan: basic-1gb
    databaseName: urlopy
    user: urlopy_user

services:
  - type: web
    name: urlopy-api
    runtime: node
    plan: starter
    rootDir: .
    autoDeploy: true
    buildCommand: npm ci && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: urlopy-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://urlopy-web.onrender.com
      - key: COMMUNICATION_MODE
        value: EMAIL_ONLY
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MAILBOX_ADDRESS
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_DRIVE_ID
        sync: false
      - key: ONEDRIVE_BASE_PATH
        value: urlopy

  - type: web
    name: urlopy-web
    runtime: node
    plan: starter
    rootDir: .
    autoDeploy: true
    buildCommand: npm ci && npm --workspace apps/web-admin run build
    startCommand: npm --workspace apps/web-admin run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://urlopy-api.onrender.com