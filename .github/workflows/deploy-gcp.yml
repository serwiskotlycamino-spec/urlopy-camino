name: Deploy To Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deployment configuration
        run: |
          set -euo pipefail

          sanitize() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/[[:space:]]*$//'
          }

          PROJECT_ID="${{ vars.GCP_PROJECT_ID }}"
          REGION="${{ vars.GCP_REGION }}"
          REPOSITORY="${{ vars.GCP_ARTIFACT_REPOSITORY }}"
          API_SERVICE="${{ vars.GCP_CLOUD_RUN_API_SERVICE }}"
          WEB_SERVICE="${{ vars.GCP_CLOUD_RUN_WEB_SERVICE }}"
          SQL_INSTANCE="${{ vars.GCP_CLOUD_SQL_INSTANCE }}"
          API_CORS_ORIGINS="${{ vars.GCP_API_CORS_ORIGINS }}"
          WEB_NEXT_PUBLIC_API_URL="${{ vars.GCP_WEB_NEXT_PUBLIC_API_URL }}"

          PROJECT_ID="$(sanitize "$PROJECT_ID")"
          REGION="$(sanitize "$REGION")"
          REPOSITORY="$(sanitize "$REPOSITORY")"
          API_SERVICE="$(sanitize "$API_SERVICE")"
          WEB_SERVICE="$(sanitize "$WEB_SERVICE")"
          SQL_INSTANCE="$(sanitize "$SQL_INSTANCE")"
          API_CORS_ORIGINS="$(sanitize "$API_CORS_ORIGINS")"
          WEB_NEXT_PUBLIC_API_URL="$(sanitize "$WEB_NEXT_PUBLIC_API_URL")"

          PROJECT_ID="${PROJECT_ID:-urlopy-camino}"
          REGION="${REGION:-europe-central2}"
          REPOSITORY="${REPOSITORY:-urlopy}"
          API_SERVICE="${API_SERVICE:-urlopy-api}"
          WEB_SERVICE="${WEB_SERVICE:-urlopy-web}"
          SQL_INSTANCE="${SQL_INSTANCE:-urlopy-camino:europe-central2:urlopy-pg}"

          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "REGION=$REGION"
            echo "REPOSITORY=$REPOSITORY"
            echo "API_SERVICE=$API_SERVICE"
            echo "WEB_SERVICE=$WEB_SERVICE"
            echo "SQL_INSTANCE=$SQL_INSTANCE"
            echo "API_CORS_ORIGINS=$API_CORS_ORIGINS"
            echo "WEB_NEXT_PUBLIC_API_URL=$WEB_NEXT_PUBLIC_API_URL"
          } >> "$GITHUB_ENV"

      - name: Validate required variables
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?Missing PROJECT_ID}"
          : "${REGION:?Missing REGION}"
          : "${REPOSITORY:?Missing REPOSITORY}"
          : "${API_SERVICE:?Missing API_SERVICE}"
          : "${WEB_SERVICE:?Missing WEB_SERVICE}"
          : "${SQL_INSTANCE:?Missing SQL_INSTANCE}"

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Missing DATABASE_URL secret in GitHub repository settings}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Resolve runtime URLs and env values
        run: |
          set -euo pipefail

          API_URL_CURRENT="$(gcloud run services describe "$API_SERVICE" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)"
          WEB_URL_CURRENT="$(gcloud run services describe "$WEB_SERVICE" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)"

          CORS_ORIGINS="$API_CORS_ORIGINS"
          if [ -z "$CORS_ORIGINS" ]; then
            if [ -n "$WEB_URL_CURRENT" ]; then
              CORS_ORIGINS="$WEB_URL_CURRENT,http://localhost:3000,http://localhost:8081"
            else
              CORS_ORIGINS="http://localhost:3000,http://localhost:8081"
            fi
          fi

          NEXT_PUBLIC_API_URL="$WEB_NEXT_PUBLIC_API_URL"
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            if [ -n "$API_URL_CURRENT" ]; then
              NEXT_PUBLIC_API_URL="$API_URL_CURRENT"
            else
              NEXT_PUBLIC_API_URL="http://localhost:3001"
            fi
          fi

          {
            echo "CORS_ORIGINS=$CORS_ORIGINS"
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
          } >> "$GITHUB_ENV"

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories create "$REPOSITORY" \
            --repository-format=docker \
            --location="$REGION" \
            --description="Urlopy Camino Docker images" \
            || true

      - name: Build and push API image
        run: |
          API_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/urlopy-api:${{ github.sha }}"
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker push "$API_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> $GITHUB_ENV

      - name: Build and push Web image
        run: |
          WEB_IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/urlopy-web:${{ github.sha }}"
          docker build -f apps/web-admin/Dockerfile -t "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"
          echo "WEB_IMAGE=$WEB_IMAGE" >> $GITHUB_ENV

      - name: Deploy API service
        run: |
          DATABASE_URL='${{ secrets.DATABASE_URL }}'
          gcloud run deploy "$API_SERVICE" \
            --image "$API_IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --add-cloudsql-instances "$SQL_INSTANCE" \
            --set-env-vars "^@^DATABASE_URL=$DATABASE_URL@CORS_ORIGINS=$CORS_ORIGINS"

      - name: Deploy Web service
        run: |
          gcloud run deploy "$WEB_SERVICE" \
            --image "$WEB_IMAGE" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"

      - name: Print service URLs
        run: |
          echo "API_URL=$(gcloud run services describe "$API_SERVICE" --region "$REGION" --format='value(status.url)')"
          echo "WEB_URL=$(gcloud run services describe "$WEB_SERVICE" --region "$REGION" --format='value(status.url)')"
